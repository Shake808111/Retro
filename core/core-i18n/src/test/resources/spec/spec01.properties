# Soll-Texte de_DE aus Spec 01 §7 (Nachrichten-Katalog) in Spec-Notation: §-Farben, {platzhalter}.
# Der Katalogtest rendert messages.properties und vergleicht Zeichen für Zeichen Text, Farbe und Formatierung.
#
# Übertragungsregeln (siehe README.md):
# - Standardtext statt Original, wo die Spalte "Standardtext (eigen)" abweicht (z. B. "ist jetzt" statt "ist nun").
# - Platzhalter in snake_case wie in MiniMessage: {rankColor} -> {rank_color}, {appealUrl} -> {appeal_url}.
#   Umbenannt wegen MiniMessage-Standard-Tags bzw. Eindeutigkeit: {hh:mm} -> {time}, {Grund} -> {reason},
#   {key} -> {mode_key}, {BRAND} -> {brand}, {name1}/{name2} -> Namensliste {names}.
# - {p:x} = Präfix prefix.x; Zeilen eines Bildschirms mit \n; "+ click.line" ist eine eigene Nachricht.
# - Auswahl {a∣b}: zwei Soll-Zeilen "key#var" (wahr) und "key#!var" (falsch).
# - Namenslisten ({names}, {buttons}) werden mit zwei Einträgen {names1}, {names2} geprüft.
# - Führende/folgende Leerzeichen als \u0020.

