# SkyWars-Kits (Spec 04 §6.2.5). Reihenfolge = Kit-Menü (Slots 9–35, max. 27). Namen/Beschreibungen: i18n
# sw.kit.<id> und sw.kit.<id>.desc. Preise und Inhalte ohne Beleg sind Annahmen der Spec (§10 #20) und hier änderbar.
#
# items:    material, amount, enchantments {name: stufe}, name (i18n-Schlüssel), durability (Rest-Haltbarkeit,
#           "Haltbarkeit X"), unbreakable, potion (typ:stufe[:sekunden]; SPLASH_POTION = Wurftrank)
# ability:  type (angel, hunter, gold_digger, stomper, devil, phantom, goat, ninja, poseidon, cloud, dog_whisperer,
#           airbender, night_mage, bees), uses (0 = unbegrenzt), cooldown (s), item (Fähigkeits-Item, Slot 9),
#           consume (Item je Nutzung verbrauchen)
# classic:  auch im Classic-Preset (Item-Kits 20–27, Starter, frühere Kits; Spec 04 §6.2.7)
# legacy:   frühere Kits, nur mit "Frühere Kits" in den Kit-Einstellungen
