sw.kit.ninja.desc=§7Werde für 5 Sekunden unsichtbar. 2 Nutzungen.
sw.kit.poseidon.desc=§7Eine Wasserwelle drängt nahe Gegner zurück und bremst sie. 3 Nutzungen.
sw.kit.wolke.desc=§7Eine Wolke trägt dich für 5 Sekunden. 3 Nutzungen.
sw.kit.hundefluesterer.desc=§7Jedes Spawnei ruft einen zahmen Wolf, der für dich kämpft.
sw.kit.luftbaendiger.desc=§7Ein Windstoß wirft Gegner in deiner Nähe zurück. 4 Nutzungen.
sw.kit.nachtmagier.desc=§7Blendet Gegner im Umkreis von 6 Blöcken für 3 Sekunden. 2 Nutzungen.
sw.kit.goldsucher.desc=§7Erze lassen beim Abbauen doppelt so viel fallen.
sw.kit.bienen.desc=§7Drei Bienen greifen den nächsten Gegner an. 1 Nutzung.
