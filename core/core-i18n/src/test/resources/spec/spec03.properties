# Soll-Texte de_DE aus Spec 03 §7.2 (Spiel-Rahmen, common.*), Notation wie spec01.properties.
# {p} -> {prefix} (Modus-Präfix prefix.mode, wie coins.round in Spec 02). {nameColor}/{teamColor}/{victimColor}/
# {killerColor} -> {name_color}/{team_color}/{victim_color}/{killer_color}. common.replay: [ANSEHEN] klickbar über
# den Stil-Platzhalter {replay_click}. Nicht im Katalog: common.gl/common.gg (farbiges GL/GG liefert chat.gg aus
