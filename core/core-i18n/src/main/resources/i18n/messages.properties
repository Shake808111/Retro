# Basis-Sprachdatei de_DE (Rückfallsprache, Spec 01 §6.14). Format: MiniMessage, UTF-8.
# Eigene Texte nach Spalte "Standardtext" der Specs; Originaltexte werden nicht ausgeliefert.
#
# Notation (Spec 00 §4.3, Spec 02 §6.13): Spec-§x wird <farbe>, Spec-{x} wird <x> (snake_case).
# - <brand> = Markenname aus gradle.properties, <brand_upper> = Marke in Großbuchstaben (nie hart codieren).
# - <p:friends> = Text von prefix.friends (Spec-Notation {p:friends}); <prefix> setzt der Aufrufer.
# - <name> = Spielername in Rangfarbe (Komponente), <player> = Name als reiner Text.
# - <..._color> sind Farb-Platzhalter (Placeholder.styling), z. B. <mode_color>, <rank_color>.
# - <x:'a':'b'> = Auswahl (Formatter.booleanChoice), <names:'<gray>, '> = Namensliste (Formatter.joining).
# - <newline> trennt Zeilen eines Bildschirms/Blocks; \\< ist ein wörtliches "<" (z. B. \\<Spieler>).
# - Varianten: <key>.one = Einzahl (Messages.plural), <key>.legacy = Fassung für UiEra.LEGACY.
# - Führende/folgende Leerzeichen stehen als \u0020 (Editoren entfernen sonst Leerzeichen am Zeilenende).

# =====================================================================================================
# Spec 01 §7 – Proxy & Social
# =====================================================================================================

