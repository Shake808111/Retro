# Soll-Texte de_DE für Schlüssel aus Spec 02, die nicht als eigene Zeile in §7 stehen, aber nötig sind.
# Gleiche Notation wie spec01.properties.

# §6.11 Namensliste der Booster: 1 -> "A", 2 -> "A, B" (≥ 3 -> coins.names.more aus §7); Namen kommen in §b
coins.names.single={first}
coins.names.pair={first}§7, {second}

# Befehlsfehler der Kern-Plugins (Incendo Cloud, Spec 02 §1 "Befehle"; Spec 00 §4.3: alle Spielertexte im Katalog)
error.command.usage=§cVerwendung: §e/{syntax}
error.command.player-only=§cDiesen Befehl können nur Spieler ausführen.
error.command.argument=§cUngültige Eingabe: §e{input}
error.command.invalid=§cUngültige Eingabe.
error.command.number=§cUngültige Zahl: §e{input}
error.command.range=§cUngültige Zahl: §e{input}§c. Erlaubt: §e{min}§c–§e{max}
error.command.unknown=§cUnbekannter Befehl.
error.command.failed=§cDer Befehl konnte nicht ausgeführt werden.
