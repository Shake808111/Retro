# Soll-Texte de_DE für Schlüssel aus Spec 01, die nicht als eigene Zeile in §7 stehen, aber nötig sind:
# in §3 (Spalte "Ausgaben") genannt, Wörter für Platzhalter aus §7 oder Einzahl-Varianten (Spec 00 §4.4).
# Gleiche Notation wie spec01.properties.

# §3 #23: Fehler-Key aus der Ausgabenspalte von /party invite
party.err.already.invited=§cDu hast {name} §cbereits eingeladen.
# Wörter für {role} in clan.promoted/.demoted (Rollen aus §6.6)
clan.role.leader=Leiter
clan.role.moderator=Moderator
clan.role.member=Mitglied
clan.role.trial=Testmitglied
# §3 #55: /clan stats [Modus] -> clan.stats.* (Kopf + Zeilen wie clan.cwstats.*)
clan.stats.header={p:clan}§7Statistiken von §e{clan} §7({mode})
clan.stats.line=§7{label}§8: §e{value}
# §3 #57: Moduswahl als Klickzeile vor clan.cwstats.*
clan.cwstats.choose={p:clan}§7Wähle einen Modus:
clan.cwstats.mode=§e[{mode}]
# §3 #83: /reports -> reports.* (offene Reports, Knopf click.take)
reports.header={p:report}§7Offene Meldungen (§e{n}§7):
reports.line=§8[§7{id}§8] §e{reporter} §7meldet §c{player} §7(§e{reason}§7) auf §e{server}
reports.empty={p:report}§7Keine offenen Meldungen.
# Wörter für {type} und {duration} in punish.ok und history.line
punish.type.ban=Bann
punish.type.mute=Mute
punish.type.kick=Kick
punish.duration.permanent=permanent
# §3 #82: /history -> history.* (Kopf und leere Liste zur Zeile history.line)
history.header=§7Strafen von §e{player}§7:
history.empty=§7Keine Strafen.
# Einzahl zu maintenance.countdown (Ansage bei 1 s, Spec 00 §4.4 "Singular bei 1")
maintenance.countdown.one=§cWartung beginnt in §e{s} §cSekunde.
# §4.1 Zeile "Wartung": MOTD-Zeile 2 und Versionstext während der Wartung
motd.line2.maintenance=§c§lWARTUNGSARBEITEN
motd.version.maintenance=§cWartung
