# Soll-Texte de_DE für Schlüssel aus Spec 08, die nicht als eigene Zeile in §7 stehen, aber nötig sind.
# Gleiche Notation wie spec01.properties.

# §3 #6/#8: Kopfzeilen für /cloud (Hilfe) und /cloud info (Felder als cloud.info.line)
cloud.help.header={p:cloud}§7Befehle:
cloud.info.header={p:cloud}§7Server §e{server}§7:
# {override} in cloud.tpl.entry: Markierung "*" für Laufzeit-Overrides (§3 #15, wie GUI C §5.3 " §c*")
cloud.tpl.override=\u0020§c*
# {time} in server.restart.chat: "5 Minuten", "60 Sekunden", "1 Sekunde" (Messages.restartTime)
server.restart.time.minutes={minutes} Minuten
server.restart.time.minutes.one={minutes} Minute
server.restart.time.seconds={seconds} Sekunden
server.restart.time.seconds.one={seconds} Sekunde
# Einzahl zu server.restart.actionbar (Countdown der letzten 10 s, Spec 00 §4.4 "Singular bei 1")
server.restart.actionbar.one=§cNeustart in §e{seconds} §cSekunde
# §3 D4: Titel des Discord-Embeds zu /stats (Felder aus stats.label.*)
bot.stats.title=Statistiken von {name}
