# =====================================================================
# Zentrale Projekt-Eigenschaften
# =====================================================================

# Markenname - der EINZIGE Ort, um die Marke umzubenennen.
# Fließt automatisch in: Plugin-Namen (paper-plugin.yml), Velocity-Plugin-ID,
# die generierte Klasse dev.netzwerk.core.api.BuildInfo, Texte mit <brand>
# (core-i18n) und den Gradle-Projektnamen.
# Erlaubt: Buchstaben A-Z/a-z, Ziffern, Leerzeichen, "_", ".", "-"
# (Paper-Plugin-Namen erlauben nichts anderes). Der Build prüft das.
brandName=Netzwerk

# Maven-Gruppe aller Artefakte. Die Java-Pakete (dev.netzwerk.*) werden davon
# NICHT automatisch umbenannt - siehe README.md, Abschnitt "Marke umbenennen".
group=dev.netzwerk
version=0.1.0-SNAPSHOT

# api-version in paper-plugin.yml.
# Quelle: PaperMC/Paper main, gradle.properties: apiVersion=26.3 (abgerufen 2026-10-20)
paperApiVersion=26.3
# Minecraft-Version für run-paper (./gradlew :lobby:runServer) und die Docker-Dev-Server
minecraftVersion=26.3
# Velocity-Version für run-velocity (./gradlew :platform:velocity-core:runVelocity)
velocityVersion=4.3.0

# Gradle-Leistung (wie im Paper-Projekt selbst: Configuration Cache, Build Cache, parallel)
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
