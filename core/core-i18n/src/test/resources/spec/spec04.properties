# common.kill (Ersatzschlüssel, Spec 04 §7.3). "Sekunde(n)" ist als Mehrzahl-Schlüssel + .one umgesetzt.
# bw.spectate.tp: {name} -> {player} (Zuschauer), {target} (Ziel). bw.title.win ist Titel + .sub.
# Ohne eigenen Text: bw.spawnroom (still abbrechen), bw.forcemap/game.start.* (Spec 03 common.*),
# bw.round.header (Spec 02 round.*).

